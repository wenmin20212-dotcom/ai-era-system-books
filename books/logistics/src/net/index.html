  el("stop", { offset: 0, "stop-color": LAYER[+ia[0]].c }, gr); el("stop", { offset: 1, "stop-color": LAYER[+ib[0]].c }, gr);
  const path = el("path", { d, class: "edge", stroke: `url(#${gid})`, "data-a": a, "data-b": b }, EG);
  path.style.setProperty("--d", (0.9 + Math.min(p.y, q.y) / H * 1.4).toFixed(2) + "s");
  path.style.setProperty("--len", path.getTotalLength().toFixed(1));
  edges.push(path);
});
// route
const RG = el("g", {});
const rp = ROUTE.map(id => P[id]);
let rd = `M${rp[0].x},${rp[0].y}`; for (let i = 1; i < rp.length; i++) { const a = rp[i - 1], b = rp[i], m = (a.y + b.y) / 2; rd += ` C${a.x},${m} ${b.x},${m} ${b.x},${b.y}`; }
const route = el("path", { d: rd, class: "route" }, RG);
ROUTE.forEach((id, i) => { const g = el("g", { class: "leg" }, RG); el("circle", { cx: P[id].x + 17, cy: P[id].y - 15, r: 9, fill: "#e0a020" }, g);
  const tt = el("text", { x: P[id].x + 17, y: P[id].y - 11, "text-anchor": "middle" }, g); tt.textContent = i + 1; });
const parcel = el("g", { class: "parcel" }, RG);
el("rect", { x: -11, y: -10, width: 22, height: 18, rx: 3, fill: "#c98a3c", stroke: "#7a4f1c", "stroke-width": 1.5 }, parcel);
el("path", { d: "M-11,-3H11M0,-10V8", stroke: "#f3dfa8", "stroke-width": 2 }, parcel);
// nodes
const NG = el("g", {}), nodes = {};
ids.forEach(id => {
  const p = P[id], l = +id[0], C = LAYER[l].c;
  const g = el("g", { class: "node", "data-id": id, "data-ch": l, tabindex: 0, role: "button", "aria-label": id + " " + SEC[id].t }, NG);
  g.style.setProperty("--d", (0.15 + (l - 1) * .09).toFixed(2) + "s");
  el("circle", { class: "hit", cx: p.x, cy: p.y, r: 24 }, g);
  el("circle", { class: "pulse", cx: p.x, cy: p.y, r: 12, stroke: C }, g);
  el("circle", { class: "ring", cx: p.x, cy: p.y, r: 12, stroke: C }, g);
  el("circle", { class: "core", cx: p.x, cy: p.y, r: 6, fill: C }, g);
  const deg = NB[id].length;
  if (deg >= 6) el("circle", { cx: p.x, cy: p.y, r: 17, fill: "none", stroke: C, "stroke-width": 1.2, "stroke-dasharray": "2 3" }, g);
  const t = el("text", { x: p.x, y: p.y + 31, "text-anchor": "middle", "font-size": 13.5 }, g); t.textContent = SHORT[id];
  const t2 = el("text", { x: p.x, y: p.y - 18, "text-anchor": "middle", "font-size": 10.5 }, g); t2.textContent = id; t2.style.fill = C;
  nodes[id] = g;
});
svg.appendChild(RG);

// ---------- state ----------
let curCh = -1, curId = null, tripOn = false;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const chName = ci => BOOK[ci].title.split(/\s/)[0];
function apply() {
  svg.classList.toggle("focus", curCh >= 1 || !!curId);
  const nbs = curId ? new Set(NB[curId].map(e => e.o)) : null;
  Object.entries(nodes).forEach(([id, g]) => {
    const on = curId ? (id === curId || nbs.has(id)) : (curCh >= 1 && +id[0] === curCh);
    g.classList.toggle("on", !!on); g.classList.toggle("sel", id === curId);
  });
  edges.forEach(p => {
    const a = p.dataset.a, b = p.dataset.b;
    p.classList.toggle("hot", !!curId && (a === curId || b === curId));
    p.classList.toggle("warm", !curId && curCh >= 1 && (+a[0] === curCh || +b[0] === curCh));
  });
  bands.forEach(b => b.classList.toggle("on", +b.dataset.ch === curCh || (curId && +b.dataset.ch === +curId[0])));
  nav.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.ch === curCh && !curId || (curCh < 0 && !curId && b.dataset.ch === "-1"))));
}
function askText(s, nb) {
  return `我在读《现代物流》（AI时代系统知识基础读物）${s.id} ${s.t}。本节要点：${s.k.join("；")}。` +
    (nb.length ? `书中与它相连的小节有：${nb.slice(0, 4).map(e => e.o + " " + SEC[e.o].t + "（共同概念：" + e.k + "）").join("；")}。` : "") +
    `\n请结合物流作为一个系统（对象、结构、功能、关系、流动、机制、技术、原理）的整体结构，讲清这一节和这些相连小节之间的关系，再给我 3 个可以用自己手边的包裹或公开资料核实的问题。`;
}
function showSec(id) {
  stopTrip(); const s = SEC[id]; curId = id; curCh = -1; apply();
  const l = s.ch, nb = NB[id].slice().sort((a, b) => b.n - a.n);
  panel.innerHTML = `<div class="kick"><i style="background:${LAYER[l].c}"></i>${esc(chName(l))} · ${LAYER[l].n}</div><h2>${esc(s.id + " " + s.t)}</h2>
  <p class="meta">本节要点</p><ul>${s.k.map(k => `<li>${esc(k)}</li>`).join("")}</ul>
  <p class="meta">与它相连（${nb.length} 条线）</p>
  <ul class="secs">${nb.map(e => `<li><button type="button" data-sec="${e.o}"><b style="color:${LAYER[+e.o[0]].c}">${e.o}</b>${esc(SHORT[e.o])}<span class="why">两节都讲到「${esc(e.k)}」</span></button></li>`).join("")}</ul>
  <div class="acts"><a class="pri" href="${esc(s.u)}">读这一节 →</a><button class="sec" type="button" id="ask">复制去问 AI</button><button class="sec" type="button" data-goch="${l}">看这一层</button></div>`;
  bindPanel(askText(s, nb));
}
function showCh(ci) {
  stopTrip(); curCh = ci; curId = null; apply();
  const C = BOOK[ci], L = LAYER[ci];
  const inNet = C.secs.filter(s => SHORT[s.id]), other = C.secs.filter(s => !SHORT[s.id]);
  const out = {}; inNet.forEach(s => NB[s.id].forEach(e => { const k = +e.o[0]; out[k] = (out[k] || 0) + 1; }));
  const outs = Object.entries(out).sort((a, b) => b[1] - a[1]);
  panel.innerHTML = `<div class="kick"><i style="background:${L.c}"></i>${esc(chName(ci))} · ${L.n}</div><h2>${esc(C.title.replace(/^\S+\s/, ""))}</h2><p class="meta">${esc(L.d)}</p>
  <ul class="secs">${inNet.map(s => `<li><button type="button" data-sec="${s.id}"><b style="color:${L.c}">${s.id}</b>${esc(s.t)}</button></li>`).join("")}
  ${other.map(s => `<li><a href="${esc(s.u)}"><b style="color:var(--muted)">${s.id}</b>${esc(s.t)} ↗</a></li>`).join("")}</ul>
  ${outs.length ? `<p class="meta">这一层连得最多的是：${outs.slice(0, 3).map(([k, n]) => `<b style="color:${LAYER[k].c}">${LAYER[k].n}</b>（${n} 条）`).join("、")}</p>` : ""}
  <div class="acts"><a class="pri" href="${esc(C.secs[0].u)}">从本章开头读 →</a></div>`;
  bindPanel(null);
}
function showStart() {
  stopTrip(); curCh = 0; curId = null; apply();
  const C = BOOK[0];
  panel.innerHTML = `<div class="kick"><i style="background:${LAYER[0].c}"></i>序章 · 起点</div><h2>${esc(C.title.replace(/^\S+\s/, ""))}</h2><p class="meta">${esc(LAYER[0].d)}</p>
  <ul class="secs">${C.secs.map(s => `<li><a href="${esc(s.u)}"><b style="color:var(--muted)">${s.id}</b>${esc(s.t)} ↗</a></li>`).join("")}</ul>
  <div class="acts"><a class="pri" href="${esc(C.secs[0].u)}">从序章读起 →</a><button class="sec" type="button" id="trip2">📦 跟一个包裹走</button></div>`;
  bindPanel(null); panel.querySelector("#trip2").onclick = startTrip;
}
function showAll() {
  stopTrip(); curCh = -1; curId = null; apply();
  panel.innerHTML = `<div class="kick">全书 · 一张网</div><h2>现代物流</h2>
  <p class="meta">九章书，九层颜色，${ids.length} 个节点，${DATA.e.length} 条线。物流本来就是一张网：网点、分拨中心、枢纽由线路连在一起；这本书的知识也是这样连起来的。</p>
  <ul class="secs">${LAYER.map((L, i) => `<li><button type="button" data-goch="${i}"><b style="color:${L.c}">●</b>${L.n} · ${esc(chName(i))} ${esc(BOOK[i].title.replace(/^\S+\s/, "").split(/[：——]/)[0])}</button></li>`).join("")}</ul>
  <p class="meta" style="margin-top:8px">带虚线外圈的节点连线最多，是全书的“枢纽”。试试右上角的「📦 跟一个包裹走」。</p>`;
  bindPanel(null);
}
function bindPanel(ask) {
  panel.querySelectorAll("[data-sec]").forEach(b => b.onclick = () => showSec(b.dataset.sec));
  panel.querySelectorAll("[data-goch]").forEach(b => b.onclick = () => +b.dataset.goch === 0 ? showStart() : showCh(+b.dataset.goch));
  const a = panel.querySelector("#ask");
  if (a && ask) a.onclick = () => {
    const done = () => { a.textContent = "已复制，粘贴到 AI 对话中 ✓"; setTimeout(() => a.textContent = "复制去问 AI", 2200); };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(ask).then(done, () => prompt("复制下面的文字：", ask)); else prompt("复制下面的文字：", ask);
  };
}
// ---------- parcel trip ----------
let raf = 0; const tripBtn = document.getElementById("trip");
function startTrip() {
  curCh = -1; curId = null; apply(); tripOn = true; svg.classList.add("trip"); tripBtn.setAttribute("aria-pressed", "true");
  Object.entries(nodes).forEach(([id, g]) => g.classList.toggle("onroute", ROUTE.includes(id)));
  panel.innerHTML = `<div class="kick">1.1 · 一个包裹的全程</div><h2>跟一个包裹走</h2>
  <p class="meta">第 1.1 节写的那只从中国网购、海运到马来西亚的免运费包裹，分四段路，一路经过这些节点：</p>
  <ul class="secs">${ROUTE.map((id, i) => `${LEGS[id] ? `<li class="meta" style="margin:8px 0 2px;color:#b07800;font-weight:600">${LEGS[id]}</li>` : ""}<li><button type="button" data-sec="${id}"><b style="color:${LAYER[+id[0]].c}">${i + 1}</b>${id} ${esc(SHORT[id])}</button></li>`).join("")}</ul>
  <div class="acts"><a class="pri" href="${esc(SEC["1.1"].u)}">读 1.1 原文 →</a><button class="sec" type="button" id="stop">回到全网</button></div>`;
  bindPanel(null); panel.querySelector("#stop").onclick = showAll;
  const len = route.getTotalLength(), T = 9000, reduce = matchMedia("(prefers-reduced-motion: reduce)").matches; let t0 = null;
  cancelAnimationFrame(raf);
  const step = ts => { if (!tripOn) return; t0 = t0 ?? ts; const f = reduce ? 1 : ((ts - t0) % (T + 1200)) / T; const pt = route.getPointAtLength(Math.min(f, 1) * len);
    parcel.setAttribute("transform", `translate(${pt.x},${pt.y})`); raf = requestAnimationFrame(step); };
  raf = requestAnimationFrame(step);
  narrow() && setTimeout(() => panel.scrollIntoView({ behavior: "smooth", block: "nearest" }), 60);
}
function stopTrip() { tripOn = false; cancelAnimationFrame(raf); svg.classList.remove("trip"); tripBtn.setAttribute("aria-pressed", "false"); }
tripBtn.onclick = () => tripOn ? showAll() : startTrip();

// ---------- events ----------
const narrow = () => matchMedia("(max-width: 1080px)").matches;
const hit = e => { const g = e.target.closest(".node"); return g && g.dataset.id; };
svg.addEventListener("click", e => { const id = hit(e); if (!id) return; showSec(id); if (narrow()) setTimeout(() => panel.scrollIntoView({ behavior: "smooth", block: "nearest" }), 60); });
svg.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && hit(e)) { e.preventDefault(); showSec(hit(e)); } });
svg.addEventListener("mousemove", e => {
  const id = hit(e); if (!id) { tip.classList.remove("show"); return; }
  const r = stage.getBoundingClientRect(); tip.textContent = `${id} ${SEC[id].t} · ${NB[id].length} 条线`;
  tip.style.left = (e.clientX - r.left) + "px"; tip.style.top = (e.clientY - r.top) + "px"; tip.classList.add("show");
});
svg.addEventListener("mouseleave", () => tip.classList.remove("show"));
nav.innerHTML = `<button type="button" data-ch="-1"><span class="dot" style="--c:var(--ink)"></span><span class="nm">全网<small>一本书，一张网</small></span></button>` +
  LAYER.map((L, i) => `<button type="button" data-ch="${i}"><span class="dot" style="--c:${L.c}"></span><span class="nm">${L.n}<small>${esc(chName(i))}</small></span></button>`).join("");
nav.querySelectorAll("button").forEach(b => b.onclick = () => { const c = +b.dataset.ch; c < 0 ? showAll() : c === 0 ? showStart() : showCh(c); });
function draw() { svg.classList.remove("draw"); void svg.getBoundingClientRect(); svg.classList.add("draw"); setTimeout(() => svg.classList.remove("draw"), 4200); }
document.getElementById("redraw").onclick = () => { showAll(); draw(); };
showAll(); draw();
})();
</script>
