<title>AI时代系统知识基础读物</title>
<style>
:root { --ink: #1f2933; --muted: #52606d; --line: #d9e2ec; --accent: #1d5fbf; --bg: #ffffff; --card: #f5f8fc; }
@media (prefers-color-scheme: dark) { :root { --ink: #e4e7eb; --muted: #9aa5b1; --line: #334e68; --accent: #7cb4ff; --bg: #0f1722; --card: #17212f; } }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif; line-height: 1.6; }
main { max-width: 960px; margin: 0 auto; padding: 40px 16px; }
h1 { font-size: 1.8em; margin: 0 0 .2em; } .sub { color: var(--muted); margin: 0 0 1.6em; }
h2 { font-size: 1.15em; margin: 0 0 14px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
h2 small { color: var(--muted); font-weight: normal; font-size: .8em; margin-left: .5em; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px 16px; }
.book { display: flex; flex-direction: column; }
.book .cov img { width: 100%; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 4px; box-shadow: 0 1px 5px rgba(0,0,0,.25); display: block; }
.book b { display: block; margin-top: 8px; font-size: 1.02em; } .book b a { color: inherit; text-decoration: none; }
.book .no { color: var(--muted); font-size: .82em; }
.langs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.langs a { font-size: .78em; padding: 1px 8px; border: 1px solid var(--line); border-radius: 999px; color: var(--accent); text-decoration: none; background: var(--card); }
.langs a:hover, .book .cov:hover img { outline: 2px solid var(--accent); }
footer { color: var(--muted); font-size: .85em; margin-top: 3em; }
</style>
</head>
